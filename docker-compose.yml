version: '3.8'

services:
  frontend:
    build: ./services/frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  backend:
    build: ./services/backend
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  worker:
    build: ./services/worker
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  redis:
    image: redis:alpine

  prometheus:
    build:
      context: .
      dockerfile: ./infra/monitoring/Prometheus.Dockerfile
    ports:
      - "9090:9090"

  grafana:
    build:
      context: .
      dockerfile: ./infra/monitoring/Grafana.Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
